<!-- This page will be redirected from any url if you are not logged in -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fablix Main Page</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
<h2 style="text-align: center">Search Movies</h2>
<!-- Set the method to POST to avoid showing the username/password in the URL
     The default action is disabled to allow your own implementation. -->
<form id="search_form" method="post" action="#" style="text-align: center">

    <div class="form-group">
        <label for="movieTitle">Title</label>
        <label>
            <input id="movieTitle" name="movieTitle" placeholder="Enter Movie Title" type="text">
        </label>
    </div>
    <div class="form-group">
        <label for="movieYear">Year</label>
        <label>
            <input id="movieYear" name="movieYear" placeholder="Enter Movie Year" type="number" min="1000" max="2026">
        </label>
    </div>
    <div class="form-group">
        <label for="movieDirector">Director</label>
        <label>
            <input id="movieDirector" name="movieDirector" placeholder="Enter Movie Director" type="text">
        </label>
    </div>
    <div class="form-group">
        <label for="movieStar">Star</label>
        <label>
            <input id="movieStar" name="movieStar" placeholder="Enter Any Movie Star" type="text">
        </label>
    </div>

    <input type="Submit" value="Search">
</form>

<div id="login_error_message"></div>

<!-- include jQuery-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<!-- include our own JS file -->
<script src="./main.js"></script>

</body>
</html>
