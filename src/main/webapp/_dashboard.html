<!-- Employee dashboard login page -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login to Fablix Employee Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src='https://www.google.com/recaptcha/api.js' type="text/javascript"></script>
</head>

<body>
<h2 style="text-align: center">Login to Fablix Employee Dashboard</h2>

<div style="text-align: center; display: block">
    <form id="employee_login_form" method="post" action="#" style="align-self: center">
        <label><b>Employee Email</b></label>
        <label>
            <input name="username" placeholder="Enter Employee Email" type="text">
        </label>
        <br>

        <label><b>Password</b></label>
        <label>
            <input name="password" placeholder="Enter Password" type="password">
        </label>
        <br>

        <input type="submit" value="Login">

        <div class="d-flex justify-content-center mb-3">
            <div id="recaptchaWrapper" style="display: inline-block">
                <div class="g-recaptcha" data-sitekey="6Lf50s8sAAAAAHnpadzJ8maIb09eooIjm0MPkMV3"></div>
                <div id="recaptchaErrorMessage" class="p-3 text-danger" style="display: none; font-size: 0.9rem;">
                    Please complete the verification before logging in!
                </div>
            </div>
        </div>
    </form>
</div>

<p id="recaptchaErrInfo" class="text-center"></p>

<div id="employee_login_error_message" style="text-align: center"></div>

<!-- include jQuery-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

<!-- include employee dashboard login JS file -->
<script src="./_dashboard.js"></script>

</body>
</html>
