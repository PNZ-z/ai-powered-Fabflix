services:
  mysql:
    image: mysql:8.4
    container_name: fabflix-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: moviedb
      MYSQL_USER: ${FABFLIX_DB_USER}
      MYSQL_PASSWORD: ${FABFLIX_DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - fabflix-mysql-data:/var/lib/mysql
      - ./createtable.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./create_employees.sql:/docker-entrypoint-initdb.d/002-employees.sql:ro
      - ./stored-procedure.sql:/docker-entrypoint-initdb.d/003-stored-procedure.sql:ro
      - ./database/dev-seed.sql:/docker-entrypoint-initdb.d/004-dev-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    container_name: fabflix-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      # Inside the Compose network MySQL is reachable as `mysql:3306`.
      FABFLIX_DB_URL: "jdbc:mysql://mysql:3306/moviedb?useUnicode=true&characterEncoding=UTF-8"
      FABFLIX_DB_USER: ${FABFLIX_DB_USER}
      FABFLIX_DB_PASSWORD: ${FABFLIX_DB_PASSWORD}
      FABFLIX_BOOT_PORT: 8081
      # Local/demo only: activates LocalRecaptchaVerifier so customer login works
      # without a Google key. Production must configure RECAPTCHA_SECRET_KEY.
      SPRING_PROFILES_ACTIVE: local

volumes:
  fabflix-mysql-data:
