<!-- This page will be redirected from any url if you are not logged in -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fablix Main Page</title>
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div class="top-nav">
    <a href="shoppingCart.html" class="nav-button">Checkout</a>
    <a href="api/logout" class="nav-button">Logout</a>
</div>
<!-- add a new panel to do the full text search on the same main page -->
<div class="panel">
    <h2 style="text-align: center">Full-text Movie Search</h2>

    <form id="fulltext_search_form" method="get" action="movieList.html" style="text-align: center">
        <div class="form-group">
            <label for="fulltext_query">Movie Title</label>
            <input
                    id="fulltext_query"
                    name="query"
                    placeholder="Search movie title"
                    type="text"
                    autocomplete="off"
            >
        </div>

        <!-- This tells movieList.js to call the new full-text servlet later -->
        <input type="hidden" name="mode" value="fulltext">

        <input type="submit" value="Search">
    </form>
</div>
<!-- old page -->
<div class="panel">
    <h2 style="text-align: center">Search Movies</h2>
    <!-- Set the method to POST to avoid showing the username/password in the URL
         The default action is disabled to allow your own implementation. -->
    <form id="search_form" method="post" action="#" style="text-align: center">

        <div class="form-group">
            <label for="movieTitle">Title</label>
            <label>
                <input id="movieTitle" name="movieTitle" placeholder="Enter Movie Title" type="text">
            </label>
        </div>
        <div class="form-group">
            <label for="movieYear">Year</label>
            <label>
                <input id="movieYear" name="movieYear" placeholder="Enter Movie Year" type="number" min="1000" max="2026">
            </label>
        </div>
        <div class="form-group">
            <label for="movieDirector">Director</label>
            <label>
                <input id="movieDirector" name="movieDirector" placeholder="Enter Movie Director" type="text">
            </label>
        </div>
        <div class="form-group">
            <label for="movieStar">Star</label>
            <label>
                <input id="movieStar" name="movieStar" placeholder="Enter Any Movie Star" type="text">
            </label>
        </div>

        <input type="Submit" value="Search">
    </form>
</div>


<div id="browse_container" style="text-align: center">
    <h2>Browse Movies</h2>

    <div class="browse-choice">
        <label>
            <input type="radio" name="browseType" value="genre" checked>
            Genre
        </label>
        <label>
            <input type="radio" name="browseType" value="title">
            Title
        </label>
    </div>

    <div id="genre_browse_section" class="browse-section">
        <div id="genre_browse_list"></div>
    </div>

    <div id="title_browse_section" class="browse-section" style="display: none;">
        <div id="title_browse_list"></div>
    </div>
</div>

<div id="login_error_message"></div>

<!-- include jQuery-->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<!-- include our own JS file -->
<script src="./main.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.devbridge-autocomplete/1.4.11/jquery.autocomplete.min.js"></script>

</body>
</html>
