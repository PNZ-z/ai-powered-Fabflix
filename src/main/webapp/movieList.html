<!-- This example is following frontend and backend separation.

    This .html performs two steps:
    1. Create a html template skeleton, with all the elements defined (some left empty) and named with ids.
    2. Load movieList.js to populate the data into empty elements.
    -->

<!doctype html>
<html lang="en">
<head>
    <!-- Required m eta tags -->
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <title>Movie List</title>
</head>
<body>


<h1>Movie Lists</h1>
<a href="main.html">
    <button type="button" class="btn btn-primary">Back to Main Page</button>
</a>

<a href="shoppingCart.html">
    <button type="button" class="btn btn-primary">Checkout</button>
</a>


<div class="table-controls" id="contentTable" style="display: flex; align-items: center; justify-content: space-between; padding: 10px;">

    <div style="flex: 1;"></div>

    <div style="flex: 2; text-align: center;">
        <label>Sort by:</label>
        <select id="sort1">
            <option value="title" selected>Title</option>
            <option value="rating">Rating</option>
        </select>
        <select id="dir1">
            <option value="ASC" selected>ASC</option>
            <option value="DESC">DESC</option>
        </select>

        <span style="margin: 0 10px;">then</span>

        <select id="sort2">
            <option value="title">Title</option>
            <option value="rating" selected>Rating</option>
        </select>
        <select id="dir2">
            <option value="ASC">ASC</option>
            <option value="DESC" selected>DESC</option>
        </select>
        <button id="apply_filter_btn" style="margin-left: 10px;" class="btn btn-outline-primary">Apply</button>
    </div>

    <div style="flex: 1; text-align: right;">
        <select name="results" id="display_number">
            <option value="10" selected>Results: 10</option>
            <option value="25">Results: 25</option>
            <option value="50">Results: 50</option>
            <option value="100">Results: 100</option>
        </select>
    </div>
</div>
<div id="loading" class="text-center mt-5">
    <h3>Loading data, please wait...</h3>
</div>
<!-- Id "star_table" is useful for jQuery to find the html element with id, class here is mapping to Bootstrap defined class CSS -->
<table id=movie_list_table class="table table-striped" style="display: none;">
    <!-- Create a table header -->
    <thead>
    <tr>
        <!-- Titles of each column-->
        <th>Title</th>
        <th>Year</th>
        <th>Director</th>
        <th>Genres</th>
        <th>Star</th>
        <th>Rating</th>
        <th>Cart</th>
    </tr>
    </thead>
    <!-- Table body is left empty here, will be populated with the data retrieved with movieList.js -->
    <!-- Again, id "star_table_body" is useful for jQuery to find this html element -->
    <tbody id=movie_list_table_body></tbody>
</table>

<div id="pagination_controls" style="text-align: center; margin-top: 20px;">
    <button id="prev_button" class="btn btn-outline-primary">Previous</button>
    <span id="page_info" style="margin: 0 15px;"></span>
    <button id="next_button" class="btn btn-outline-primary">Next</button>
</div>

<div style="text-align: right; margin: 10px 20px;">
    <a href="api/logout" class="btn btn-secondary">Logout</a>
</div>

<!-- Load jQuery and Bootstrap JS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<!-- Load our own JS file -->
<!-- The path is relative to movieList.html, since these two files are in the same directory -->
<!-- Note the url does not contain a "/" in the beginning, which means the url is relative to current path
     otherwise the url is relative to the root path-->
<script src="movieList.js"></script>
</body>


</html>
