name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify tests and online application coverage gate
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          report="target/site/jacoco/jacoco.csv"

          if [[ ! -f "$report" ]]; then
            echo "## JaCoCo coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          awk -F, '
            NR > 1 {
              branch_missed += $6
              branch_covered += $7
              line_missed += $8
              line_covered += $9
            }
            END {
              line_total = line_missed + line_covered
              branch_total = branch_missed + branch_covered
              line_percent = line_total == 0 ? 0 : 100 * line_covered / line_total
              branch_percent = branch_total == 0 ? 0 : 100 * branch_covered / branch_total

              print "## JaCoCo online web application coverage"
              print ""
              print "| Metric | Covered | Total | Coverage |"
              print "| --- | ---: | ---: | ---: |"
              printf "| Lines | %d | %d | %.2f%% |\n", line_covered, line_total, line_percent
              printf "| Branches | %d | %d | %.2f%% |\n", branch_covered, branch_total, branch_percent
              print ""
              print "The 90% gate applies to the Spring Boot online application. Offline XML imports and their model, batch worker/tasks, local account setup, password initialization, and index maintenance utilities are intentionally outside this scope."
            }
          ' "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend (lint, test, coverage, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
