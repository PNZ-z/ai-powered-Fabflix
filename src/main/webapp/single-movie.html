<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <title>Single Movie</title>
</head>
<body>

<div class="container mt-4">
    <h1>Movie Details</h1>

    <p>
        <a href="api/jump-back">Back to Movie List</a>
    </p>

    <table class="table table-striped">
        <tbody>
        <tr>
            <th>Title</th>
            <td id="movie_title"></td>
        </tr>
        <tr>
            <th>Year</th>
            <td id="movie_year"></td>
        </tr>
        <tr>
            <th>Director</th>
            <td id="movie_director"></td>
        </tr>
        <tr>
            <th>Genres</th>
            <td id="movie_genres"></td>
        </tr>
        <tr>
            <th>Stars</th>
            <td id="movie_stars"></td>
        </tr>
        <tr>
            <th>Rating</th>
            <td id="movie_rating"></td>
        </tr>
        </tbody>
    </table>
</div>

<div style="text-align: right; margin: 10px 20px;">
    <a href="api/logout" class="btn btn-secondary">Logout</a>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

<script src="single-movie.js"></script>
</body>
</html>
