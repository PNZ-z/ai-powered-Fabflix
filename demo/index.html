<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=iterations/b1-5f/">
  <title>Fabflix 变更演示</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#131a2e; --text:#e8edf7; --muted:#94a3b8; --accent:#7dd3fc; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 20% 0%, #1e3a5f 0, var(--bg) 42%); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(760px, calc(100% - 32px)); padding:32px; border:1px solid #26324d; border-radius:20px; background:rgba(19,26,46,.86); box-shadow:0 24px 80px rgba(0,0,0,.35); }
    .eyebrow { color:var(--accent); font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:8px 0 6px; font-size:clamp(30px,6vw,48px); line-height:1.1; }
    p { color:var(--muted); margin:0 0 20px; }
    a { color:var(--accent); }
    .links { display:flex; gap:12px; flex-wrap:wrap; margin-top:24px; }
    .btn { display:inline-block; padding:10px 14px; border-radius:10px; background:#1d4ed8; color:white; text-decoration:none; font-weight:600; }
    .btn.secondary { background:#1e293b; border:1px solid #334155; }
    .note { margin-top:20px; padding:12px 14px; border-left:3px solid #f59e0b; background:#2a2114; color:#fcd34d; font-size:14px; border-radius:0 8px 8px 0; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Fabflix · LAN change demo</div>
    <h1>最新变更：B1.5f</h1>
    <p>新盲集 FAIL：G1-T 24/30，暴露标题守卫与中文 seed 抽取回归。</p>
    <div class="links">
      <a class="btn" href="iterations/b1-5f/">打开 B1.5f 变更页 →</a>
      <a class="btn secondary" href="iterations/b1-5f/#verification">看失败归因</a>
    </div>
    <div class="note">演示站是静态页面，运行在开发机的 4173 端口；不会暴露数据库、Ollama 或完整应用。</div>
  </main>
</body>
</html>
