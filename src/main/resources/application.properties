server.port=${FABFLIX_BOOT_PORT:8081}

spring.datasource.url=${FABFLIX_DB_URL:jdbc:mysql://localhost:3307/moviedb?useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${FABFLIX_DB_USER:fabflix}
spring.datasource.password=${FABFLIX_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.com.fabflix.boot=INFO

fabflix.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}

# AI: Spring AI owns the connection and model parameters (single source of truth).
spring.ai.ollama.base-url=${FABFLIX_AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${FABFLIX_AI_CHAT_MODEL:qwen2.5:7b}
spring.ai.ollama.embedding.options.model=${FABFLIX_AI_EMBEDDING_MODEL:bge-m3}

# AI: project-owned switch only; fabflix.ai.* never repeats connection parameters.
fabflix.ai.enabled=${FABFLIX_AI_ENABLED:false}
