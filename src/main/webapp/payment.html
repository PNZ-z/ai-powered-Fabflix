<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment</title>
</head>
<body>

<h1>Payment</h1>

<a href="shoppingCart.html">
    <button type="button">Back to Shopping Cart</button>
</a>

<a href="api/logout">
    <button type="button">Logout</button>
</a>

<h3 id="payment_total_price">Total Price: $0.00</h3>

<div id="payment_error_message" style="color: red;"></div>

<form id="payment_form" method="post" action="#">
    <label>
        First Name:
        <input type="text" id="firstName" name="firstName" required>
    </label>
    <br><br>

    <label>
        Last Name:
        <input type="text" id="lastName" name="lastName" required>
    </label>
    <br><br>

    <label>
        Credit Card Number:
        <input type="text" id="creditCardNumber" name="creditCardNumber" required>
    </label>
    <br><br>

    <label>
        Expiration Date:
        <input type="date" id="expirationDate" name="expirationDate" required>
    </label>
    <br><br>

    <input type="submit" value="Place Order">
</form>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
<script src="payment.js"></script>

</body>
</html>
