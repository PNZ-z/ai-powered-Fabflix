<!-- Employee dashboard main page. Requires employee login session. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fablix Employee Dashboard</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">
</head>

<body>
<div class="container mt-4">
    <h2 class="text-center">Fablix Employee Dashboard</h2>
    <p class="text-center">Welcome to the employee dashboard.</p>

    <hr>

    <!-- Step 4 Part 1: Add a new star -->
    <h4>Add a New Star</h4>

    <form id="add_star_form">
        <div class="form-group">
            <label for="star_name"><b>Star Name</b></label>
            <input
                    type="text"
                    class="form-control"
                    id="star_name"
                    name="star_name"
                    placeholder="Enter star name"
                    required>
        </div>

        <div class="form-group">
            <label for="birth_year"><b>Birth Year</b> Optional</label>
            <input
                    type="number"
                    class="form-control"
                    id="birth_year"
                    name="birth_year"
                    placeholder="Enter birth year"
                    min="0">
        </div>

        <button type="submit" class="btn btn-primary">Insert Star</button>
    </form>

    <div id="add_star_message" class="mt-3"></div>

    <hr>

    <!-- Step 4 Part 2: Show database metadata -->
    <h4>Database Metadata</h4>

    <p>
        Click the button below to show every table name, column name, and column type in the database.
    </p>

    <button id="metadata_button" class="btn btn-secondary">Show Metadata</button>

    <div id="metadata_result" class="mt-3"></div>

    <hr>

    <h4>Add a New Movie</h4>

    <form id="add_movie_form">
        <div class="form-group">
            <label for="movie_title"><b>Movie Title</b></label>
            <input
                    type="text"
                    class="form-control"
                    id="movie_title"
                    name="movie_title"
                    placeholder="Enter movie title"
                    required>

        </div>

        <div class="form-group">
            <label for="movie_year"><b>Movie Year</b></label>
            <input
                    type="number"
                    class="form-control"
                    id="movie_year"
                    name="movie_year"
                    placeholder="Enter movie year"
                    min="0"
                    required>

        </div>

        <div class="form-group">
            <label for="movie_director"><b>Movie Director</b></label>
            <input
                    type="text"
                    class="form-control"
                    id="movie_director"
                    name="movie_director"
                    placeholder="Enter movie director"
                    required>
        </div>

        <div class="form-group">
            <label for="movie_star_name"><b>Star Name</b></label>
            <input
                    type="text"
                    class="form-control"
                    id="movie_star_name"
                    name="movie_star_name"
                    placeholder="Enter one star name"
                    required>
        </div>

        <div class="form-group">
            <label for="movie_star_birth_year"><b>Star Birth Year</b> Optional</label>
            <input
                    type="number"
                    class="form-control"
                    id="movie_star_birth_year"
                    name="movie_star_birth_year"
                    placeholder="Enter star birth year"
                    min="0">
        </div>

        <div class="form-group">
            <label for="movie_genre_name"><b>Genre Name</b></label>
            <input
                    type="text"
                    class="form-control"
                    id="movie_genre_name"
                    name="movie_genre_name"
                    placeholder="Enter one genre name"
                    required>
        </div>

        <button type="submit" class="btn btn-primary">Add Movie</button>

    </form>

    <div id="add_movie_message" class="mt-3"></div>
</div>

<!-- include jQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

<!-- include dashboard JS -->
<script src="./dashboard.js"></script>

</body>
</html>
